<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoM Styles</title>
    <style>
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(224, 224, 134, 0.897)
        }

        body div{
            width: 40%;
            height: 30%;
            background-color: rgba(180, 237, 106, 0.258);
            backdrop-filter: blur(100px);
            border-radius: 10%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
            box-shadow: 10px 10px 8px 1px rgba(0, 0, 0, 0.252);


        }

        span {
            font-size: 4rem;
            letter-spacing: 1rem;
            font-weight: 700;
        }
    </style>
    <linK rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <span>R</span>
        <span>A</span>
        <span>I</span>
        <span>N</span>
        <span>B</span>
        <span>O</span>
        <span>W</span>
        <button type="click">Click Me</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
