<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon List</title>
    <style>
        #container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        div {
            width: 100px;
            height: 100px;
            display: flex;
            position: relative;
            padding: 10px;
            border: 1px dashed black;
            align-items: flex-start;
        }

        h3 {
            align-self: start;
            position: absolute;

            left: 0;
            bottom: 0%;
        }
    </style>
</head>

<body>
    <h1>Look at my Pokemons</h1>
    <section id="container">

    </section>
    <script src="script.js"></script>

</body>

</html>
