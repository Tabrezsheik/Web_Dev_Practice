<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color Generator</title>
    <style>
        body {
            width: 99vw;
            height: 99vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        div {
            width: 30%;
            height: 50%;
            color: rgb(0, 0, 0);
            background-color: azure;
            border: 1px solid black;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 1rem;
            gap: 8px;

        }

        div h1 {
            font-size: 1.9rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 800;
            color: blue;
        }

        div p {
            font-size: 1.5rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 800;
            color: black;


        }

        button {
            font-size: 1.2rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 1rem 1.5rem;
            border-radius: 2.3rem;
            border: none;
            background-color: yellow;
            color: black;
            box-shadow: 2px 2px 5px 2px rgba(0, 0, 0, 0.2);
        }

        .card {
            width: 50%;
            height: 60%;
            border: 0.5px solid black;
        }
    </style>
</head>

<body>
    <div>
        <h1>Color Generator</h1>
        <p>rgb(0,0,0)</p>
        <div class="card"></div>
        <button>Click Me</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
